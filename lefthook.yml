# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "apps/frontend/**/*.{js,jsx,ts,tsx}"
      run: cd apps/frontend && bun run check
    api-typecheck:
      glob: "apps/api/**/*.{ts}"
      run: cd apps/api && bun run typecheck

pre-push:
  commands:
    check:
      run: bun run check
