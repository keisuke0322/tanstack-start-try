# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "**/*.{js,jsx,ts,tsx}"
      run: bun run check
    api-typecheck:
      glob: "apps/api/**/*.{ts}"
      # Only run api typecheck when the directory exists (repository may have moved code)
      run: '[ -d apps/api ] && cd apps/api && bun run typecheck || echo "skipping api-typecheck"'

pre-push:
  commands:
    check:
      run: bun run check
